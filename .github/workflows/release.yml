name: Release

# Publish to PyPI when a GitHub release is published (tag like v0.1.0).
# Uses PyPI trusted publishing, so no API token is stored in GitHub.
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/power-admin
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Check tag matches package version
        run: |
          version=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pyproject version $version" >&2
            exit 1
          fi
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: uv build
      - run: uv publish
